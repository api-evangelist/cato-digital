aid: cato-digital
name: Cato Digital
description: >-
  Cato Digital is a sustainable bare metal cloud provider that repurposes
  large-scale, second-life servers from hyperscalers like Meta and NVIDIA to
  deliver AI & GPU servers (up to 512GB VRAM), ephemeral application servers,
  and build-your-own storage arrays at 60-75% below major cloud providers.
  Led by CEO Dean Nelson, the company operates on a "use what we have before we
  build more" circular-economy principle, tapping underutilized data center
  capacity and clean energy, and is a founding member of the Infrastructure
  Masons Climate Accord. Customers provision and manage infrastructure through
  the Cato console rather than a public developer API.
